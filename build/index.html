<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reuben page</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  overflow: hidden;
}

.countdown {
  text-align: center;
  animation: fadeIn 2s ease-in-out;
  background: rgba(0, 0, 0, 0.7);
  padding: 2rem;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  position: relative;
  overflow: hidden;
}

.countdown::before, .countdown::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 15px;
  pointer-events: none;
  z-index: 1;
}

.countdown::before {
  border: 4px solid transparent;
  animation: borderLight 3s linear infinite;
}

.countdown::after {
  top: 7px;
  right: 7px;
  bottom: 7px;
  left: 7px;
  border: 5px solid transparent;
  animation: borderLight 3s linear infinite;
}

@keyframes borderLight {
  0% { border-color: red; }
  25% { border-color: yellow; }
  50% { border-color: green; }
  75% { border-color: cyan; }
  100% { border-color: red; }
}

/*.countdown h1 {
  font-size: 3rem;
  margin-bottom: 1rem;
  background: linear-gradient(to right, #ff416c, #ff4b2b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textGlow 3s infinite;
  z-index: 2;
}*/

.time {
  font-size: 5rem;
  letter-spacing: 0.1em;
  animation: glow 1.5s infinite alternate;
  color: #ffdfba;
  text-shadow: 0 0 20px #ff416c, 0 0 30px #ff4b2b;
  z-index: 2;
}

.message {
  display: none;
  text-align: center;
  padding: 1rem;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.8);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  z-index: 2;
}

.message h1 {
  font-size: 4rem;
  margin: 0;
  color: #ffdfba;
  animation: fadeIn 3s ease-in-out;
  text-shadow: 0 0 15px #ff416c;
}

.fireworks {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff, 0 0 20px #ff416c, 0 0 30px #ff4b2b; }
  to { text-shadow: 0 0 20px #ff416c, 0 0 40px #ff4b2b, 0 0 60px #ff416c; }
}

@keyframes textGlow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

@media (max-width: 768px) {
  .countdown {
    padding: 1.5rem;
    border-radius: 10px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
  }

  .countdown h1 {
    font-size: 2.5rem;
    margin-top: 2rem;
  }

  .time {
    font-size: 4rem;
    margin-top: 1rem;
  }

  .message h1 {
    font-size: 3rem;
  }
}

@media (max-width: 480px) {
  .countdown {
    padding: 1rem;
    border-radius: 8px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
  }

  .countdown h1 {
    font-size: 2.5rem;
    margin-top: 1.5rem;
  }

  .time {
    font-size: 3.5rem;
    margin-top: 1rem;
  }

  .message h1 {
    font-size: 2.5rem;
  }
}


.countdown h1 {
  font-size: 3rem;
  font-weight: bold;
  margin-bottom: 1rem;
  background: linear-gradient(270deg, green, yellow, red, green);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textRun 3s infinite linear;
  z-index: 2;
}

@keyframes textRun {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}




</style>
</head>
<body>
    <div class="countdown">
      <h1> Reuben Countdown to 2025</h1>
      <div class="time" id="time"></div>
    </div>
    <div class="message" id="message">
      <h1>🎉 Happy New Year 2025! 🎆</h1>
      <p>Wishing you a fantastic year ahead!</p>
    </div>
    <canvas class="fireworks" id="fireworks"></canvas>
    <script src="./newYear.js"></script>
  </body>
</html>
